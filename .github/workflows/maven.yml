# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build with Maven
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./mvnw -s .settings.xml clean org.jacoco:jacoco-maven-plugin:prepare-agent install -U -P sonar -nsu --batch-mode -Dmaven.test.redirectTestOutputToFile=true -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn -Dtest='${{ inputs.test-filter }}' -Dsurefire.failIfNoSpecifiedTests=false
          else
            ./mvnw -s .settings.xml clean org.jacoco:jacoco-maven-plugin:prepare-agent install -U -P sonar -nsu --batch-mode -Dmaven.test.redirectTestOutputToFile=true -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
          fi
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always() # always run even if the previous step fails
        with:
          report_paths: '**/surefire-reports/TEST-*.xml'
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/surefire-reports/*'
      - name: Upload spring-cloud-context jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-cloud-context-jar
          path: spring-cloud-context/target/spring-cloud-context-3.1.9.jar
          if-no-files-found: error
      - name: List skipped tests with reasons
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          mods = {}
          print("Skipped tests (surefire <skipped> entries):")
          for x in sorted(glob.glob('**/surefire-reports/TEST-*.xml', recursive=True)):
              d = os.path.dirname(x)
              r = ET.parse(x).getroot()
              m = mods.setdefault(d, [0, 0, 0, 0])
              m[0] += int(r.get('tests', 0)); m[1] += int(r.get('failures', 0)); m[2] += int(r.get('errors', 0)); m[3] += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  sk = tc.find('skipped')
                  if sk is not None:
                      cls, name = tc.get('classname'), tc.get('name')
                      print(f"  SKIPPED {cls}#{name}: {sk.get('message') or (sk.text or '').strip() or 'no message'}")
                      rel = cls.split('$')[0].replace('.', '/') + '.java'
                      for src in glob.glob('*/src/test/java/' + rel):
                          lines = open(src, encoding='utf-8').read().splitlines()
                          for i, l in enumerate(lines):
                              if ('void ' + name + '(') in l:
                                  j = i
                                  while j > 0 and lines[j - 1].strip().startswith(('@', '//')):
                                      j -= 1
                                  ann = ' '.join(x.strip() for x in lines[j:i])
                                  print(f"    reason: upstream test source {src}:{i + 1} carries `{ann}` (disabled by the project itself, not by this build)")
                                  break
          print("Per-module totals:")
          for d, (t, f, e, s) in sorted(mods.items()):
              print(f"{d}: tests={t} failures={f} errors={e} skipped={s} passed={t-f-e-s}")
          PY
